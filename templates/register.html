<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="center-content">
  <form method="POST" action="{{ url_for('main.register') }}" class="card">
    <h1 class="card-title">Register</h1>
    <div class="form-group">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" name="email" placeholder="email" class="form-input" required>
    </div>
    <div class="form-group">
      <label for="fullname" class="form-label">Full Name</label>
      <input type="text" name="fullname" placeholder="full name" class="form-input" required>
    </div>
    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input type="password" name="password" placeholder="password" class="form-input" required>
    </div>
    <button type="submit" class="form-button">Register</button> <br>
    <p>Already have an account? Login <a href="{{ url_for('main.login') }}" class="rl">here</a>.</p>
  </form>
</body>
</html>
