{% extends '/admin/admin_base.html' %}

{% block title %} Add Lots {% endblock %}

{% block content %}
<div class="center-content">
  <form method="POST" action="{{ url_for('main.add_lot') }}" class="card">
    <h1 class="card-title">Add Lot</h1>
    <div class="form-group">
      <label class="form-label"> Location: </label>
      <input type="text" name="location" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label"> Price: </label>
      <input type="number" name="price" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label"> Address: </label>
      <input type="text" name="address" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label"> Pin Code: </label>
      <input type="number" name="pincode" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label"> Maximum Spots: </label>
      <input type="number" name="max_spots" class="form-input" required>
    </div>
    <button type="submit" class="form-button">Create</button>
  </form>
</div>
{% endblock %}
